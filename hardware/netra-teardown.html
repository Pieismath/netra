<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Netra Teardown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Saira+Condensed:wght@600;700&display=swap">
<style>
  :root {
    --ground-top: #EEF2F0;
    --ground-bottom: #D6DEDA;
    --surface: #FFFFFF;
    --ink: #16201E;
    --ink-2: #4B5955;
    --ink-3: #6F7C78;
    --hair: #C8D2CF;
    --pill: #FFFFFFC4;
    --shadow: 0 8px 28px rgba(22, 32, 30, 0.16);
    --accent: #0A8475;
    --cat-enclosure: #74817D;
    --cat-radio: #B9682A;
    --cat-compute: #466AA8;
    --cat-interface: #93539F;
    --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground-top: #18211F;
      --ground-bottom: #0C1211;
      --surface: #1A2321;
      --ink: #E0E9E6;
      --ink-2: #A9B7B3;
      --ink-3: #7C8B87;
      --hair: #2A3532;
      --pill: #1A2321CC;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --accent: #41D0BB;
      --cat-enclosure: #97A4A0;
      --cat-radio: #DE8B45;
      --cat-compute: #7D9BD5;
      --cat-interface: #C385CE;
    }
  }
  :root[data-theme="dark"] {
    --ground-top: #18211F;
    --ground-bottom: #0C1211;
    --surface: #1A2321;
    --ink: #E0E9E6;
    --ink-2: #A9B7B3;
    --ink-3: #7C8B87;
    --hair: #2A3532;
    --pill: #1A2321CC;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    --accent: #41D0BB;
    --cat-enclosure: #97A4A0;
    --cat-radio: #DE8B45;
    --cat-compute: #7D9BD5;
    --cat-interface: #C385CE;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--ground-top), var(--ground-bottom)) fixed;
    color: var(--ink);
    font: 400 14px/1.45 var(--font-body);
    padding-inline: 16px;
    padding-block: 16px;
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { position: relative; height: calc(100vh - 32px); min-height: 420px; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .stage canvas.picking { cursor: pointer; }
  .stage canvas:active { cursor: grabbing; }

  .brand {
    position: absolute; top: 2px; left: 2px;
    font: 700 20px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase;
    pointer-events: none;
  }
  .hint {
    position: absolute; top: 4px; right: 2px;
    font-size: 13px; color: var(--ink-3); white-space: nowrap; pointer-events: none;
    transition: opacity 0.4s;
  }
  .hint.is-gone { opacity: 0; }
  .controls {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 22px;
    width: max-content; max-width: 100%;
    background: var(--pill); border: 1px solid var(--hair); border-radius: 999px;
    padding: 9px 18px;
  }
  .slider { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .slider input { width: 120px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .slider output { min-width: 2.8em; font: 400 11px/1 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .info {
    position: absolute; width: max-content; max-width: min(260px, calc(100% - 16px));
    background: var(--surface); border-radius: 8px; box-shadow: var(--shadow);
    padding: 10px 12px 11px; display: grid; gap: 3px;
  }
  .info[hidden] { display: none; }
  .info-name { display: flex; align-items: center; gap: 7px; font: 600 17px/1.15 var(--font-display); letter-spacing: 0.02em; }
  .info-name i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--accent)); flex: none; }
  .info-role { font-size: 13px; color: var(--ink-2); }
  .info-size { font: 400 11px/1.4 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: pre-line; }

  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 400 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  }
  .loading[hidden] { display: none; }

  @media (max-width: 640px) {
    .controls { left: 0; transform: none; width: 100%; flex-direction: column; align-items: stretch; border-radius: 14px; }
    .slider { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 2.8em; gap: 10px; }
    .slider input { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<main class="stage" id="stage">
  <canvas id="view" aria-label="3D model of the Netra hotspot. Drag to rotate, scroll to zoom, click a part for details."></canvas>
  <div class="loading" id="loading">Loading model…</div>
  <p class="brand">Netra</p>
  <p class="hint" id="hint">Drag to rotate · click any part</p>
  <div class="controls" role="group" aria-label="View controls">
    <label class="slider" for="opacity">Shell opacity <input type="range" id="opacity" min="0" max="100" value="22"><output id="opacity-out" for="opacity">22%</output></label>
    <label class="slider" for="explode">Explode <input type="range" id="explode" min="0" max="100" value="90"><output id="explode-out" for="explode">90%</output></label>
    <label class="slider" for="cut">Cut away <input type="range" id="cut" min="0" max="100" value="0"><output id="cut-out" for="cut">Off</output></label>
  </div>
  <div class="info" id="info" aria-live="polite" hidden>
    <p class="info-name"><i></i><span id="info-name"></span></p>
    <p class="info-role" id="info-role"></p>
    <p class="info-size" id="info-size"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* ============================================================
   Netra teardown viewer
   Device frame: millimeters, Z up, bottom of the device at z = 0,
   long axis on X, the front edge faces -Y. The root group is turned
   so +Z becomes three.js +Y.
   ============================================================ */

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const FINISHES = {
  graphite: { shell: "#2B2D32", button: "#3B3E45", led: "#3BE3CB" },
  chalk:    { shell: "#E4E0D8", button: "#C8C3BA", led: "#34B8FF" },
  ember:    { shell: "#B8441C", button: "#26272B", led: "#FFE7C4" },
};

const CATEGORIES = [
  { key: "enclosure", label: "Enclosure", token: "--cat-enclosure" },
  { key: "radio", label: "Radio", token: "--cat-radio" },
  { key: "compute", label: "Compute & power", token: "--cat-compute" },
  { key: "interface", label: "Controls & I/O", token: "--cat-interface" },
];

const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1e6);

/* ---------------- planform + swept geometry ---------------- */

/** Closed CCW outline with outward normals. r = W/2 gives a stadium, L = W = 2r a circle. */
function outline(L, W, r, seg = 10) {
  r = Math.max(Math.min(r, L / 2, W / 2), 0.01);
  const cx = L / 2 - r, cy = W / 2 - r, pts = [];
  [[cx, cy, 0], [-cx, cy, 90], [-cx, -cy, 180], [cx, -cy, 270]].forEach(([qx, qy, a0]) => {
    for (let i = 0; i <= seg; i++) {
      const a = (a0 + (90 * i) / seg) * Math.PI / 180;
      const p = { x: qx + r * Math.cos(a), y: qy + r * Math.sin(a), nx: Math.cos(a), ny: Math.sin(a) };
      const last = pts[pts.length - 1];
      if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 1e-6) pts.push(p);
    }
  });
  if (Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) < 1e-6) pts.pop();
  return pts;
}
const insetPts = (pts, d) => pts.map((p) => ({ x: p.x - p.nx * d, y: p.y - p.ny * d, nx: p.nx, ny: p.ny }));
const movePts = (pts, dx, dy) => pts.map((p) => ({ ...p, x: p.x + dx, y: p.y + dy }));

/** Sweep a profile ({d: inset, z, h: normal along outline normal, v: normal along Z}) around an outline. */
function sweep(pts, profile, closed = true) {
  const n = pts.length, m = profile.length;
  const pos = new Float32Array(n * m * 3), nor = new Float32Array(n * m * 3);
  profile.forEach((q, i) => {
    const len = Math.hypot(q.h, q.v) || 1;
    pts.forEach((p, j) => {
      const k = (i * n + j) * 3;
      pos[k] = p.x - p.nx * q.d; pos[k + 1] = p.y - p.ny * q.d; pos[k + 2] = q.z;
      nor[k] = (p.nx * q.h) / len; nor[k + 1] = (p.ny * q.h) / len; nor[k + 2] = q.v / len;
    });
  });
  const idx = [];
  const spans = closed ? n : n - 1;
  for (let i = 0; i < m - 1; i++) {
    for (let j = 0; j < spans; j++) {
      const a = i * n + j, b = i * n + ((j + 1) % n), c = (i + 1) * n + ((j + 1) % n), d = (i + 1) * n + j;
      const ux = pos[b * 3] - pos[a * 3], uy = pos[b * 3 + 1] - pos[a * 3 + 1], uz = pos[b * 3 + 2] - pos[a * 3 + 2];
      const vx = pos[d * 3] - pos[a * 3], vy = pos[d * 3 + 1] - pos[a * 3 + 1], vz = pos[d * 3 + 2] - pos[a * 3 + 2];
      const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
      const agrees = fx * nor[a * 3] + fy * nor[a * 3 + 1] + fz * nor[a * 3 + 2] >= 0;
      if (agrees) idx.push(a, b, c, a, c, d); else idx.push(a, c, b, a, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

/** Quarter-round profile points; sign = -1 points normals into a cavity. */
function arc(dc, zc, r, a0, a1, steps, sign = 1) {
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const a = (a0 + ((a1 - a0) * i) / steps) * Math.PI / 180;
    out.push({ d: dc - r * Math.cos(a), z: zc + r * Math.sin(a), h: sign * Math.cos(a), v: sign * Math.sin(a) });
  }
  return out;
}

/** Flat face from an outline, with holes, facing +Z (dir 1) or -Z (dir -1). */
function capGeometry(pts, holes, z, dir) {
  const shape = new THREE.Shape(pts.map((p) => new THREE.Vector2(p.x, p.y)));
  holes.forEach((h) => shape.holes.push(new THREE.Path(h.map((p) => new THREE.Vector2(p.x, p.y)))));
  const g = new THREE.ShapeGeometry(shape);
  g.translate(0, 0, z);
  if (dir < 0) {
    const ix = g.index.array;
    for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; }
    const nr = g.attributes.normal.array;
    for (let i = 2; i < nr.length; i += 3) nr[i] = -1;
  }
  return g;
}

/**
 * Hollow molded housing, open at z = 0 (the parting line), closed at z = H.
 * R = outer edge fillet, c = parting-line round, wall = wall thickness.
 */
function housingGeometries(pts, H, R, c, wall, holes = []) {
  const Rin = Math.max(R - wall, 0.4);
  const outer = [...arc(c, c, c, -90, 0, 3), ...arc(R, H - R, R, 0, 90, 7)];
  const inner = [{ d: wall, z: 0, h: -1, v: 0 }, ...arc(wall + Rin, H - wall - Rin, Rin, 0, 90, 5, -1)];
  const rim = [{ d: c, z: 0, h: 0, v: -1 }, { d: wall, z: 0, h: 0, v: -1 }];
  const geos = [sweep(pts, outer), sweep(pts, inner), sweep(pts, rim)];
  geos.push(capGeometry(insetPts(pts, R), holes, H, 1));
  geos.push(capGeometry(insetPts(pts, wall + Rin), holes, H - wall, -1));
  holes.forEach((h) => geos.push(sweep(h, [{ d: 0, z: H - wall, h: -1, v: 0 }, { d: 0, z: H, h: -1, v: 0 }])));
  return geos;
}

/** Rounded box from z = 0 to z = H with softened edges. */
function roundedBox(L, W, H, r = 0.8, bevel = 0.25, seg = 6) {
  bevel = Math.max(0, Math.min(bevel, H / 2 - 0.02, r - 0.02));
  const shape = new THREE.Shape(outline(L, W, r, seg).map((p) => new THREE.Vector2(p.x, p.y)));
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: Math.max(H - 2 * bevel, 0.02), bevelEnabled: bevel > 0, bevelThickness: bevel,
    bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 2, curveSegments: seg,
  });
  g.translate(0, 0, bevel);
  return g;
}

/** Cylinder standing on z = 0, axis +Z. */
function cylinderZ(r, h, seg = 28, rTop = r) {
  const g = new THREE.CylinderGeometry(rTop, r, h, seg);
  g.rotateX(Math.PI / 2);
  g.translate(0, 0, h / 2);
  return g;
}

function canvasTexture(w, h, draw) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

/** Map a canvas texture onto the XY caps of an extrusion L x W centered at the origin. */
function fitTexture(tex, L, W) {
  tex.repeat.set(1 / L, 1 / W);
  tex.offset.set(0.5, 0.5);
  return tex;
}

/* ---------------- materials ---------------- */

const shellMaterials = [];
const buttonMaterials = [];
const ledMaterials = [];

function material(kind, extra = {}) {
  const base = { clippingPlanes: [cutPlane], clipShadows: true };
  let m;
  switch (kind) {
    case "shell":
      m = new THREE.MeshPhysicalMaterial({ ...base, color: 0x2b2d32, roughness: 0.62, sheen: 0.35,
        sheenRoughness: 0.7, sheenColor: new THREE.Color(0x8d9794), side: THREE.DoubleSide });
      shellMaterials.push(m);
      break;
    case "button":
      m = new THREE.MeshPhysicalMaterial({ ...base, color: 0x3b3e45, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.1 });
      buttonMaterials.push(m);
      break;
    case "led":
      m = new THREE.MeshStandardMaterial({ ...base, color: 0xffffff, emissive: 0x3be3cb, emissiveIntensity: 2.4 });
      ledMaterials.push(m);
      break;
    case "lightguide":
      m = new THREE.MeshPhysicalMaterial({ ...base, color: 0xf2fffc, roughness: 0.35, transmission: 0.6,
        thickness: 1.5, emissive: 0x3be3cb, emissiveIntensity: 0.8 });
      ledMaterials.push(m);
      break;
    case "mask": m = new THREE.MeshStandardMaterial({ ...base, color: 0xffffff, roughness: 0.48 }); break;
    case "fr4": m = new THREE.MeshStandardMaterial({ ...base, color: 0xbfae7c, roughness: 0.75 }); break;
    case "can": m = new THREE.MeshStandardMaterial({ ...base, color: 0xc9cdd1, metalness: 0.9, roughness: 0.34 }); break;
    case "chip": m = new THREE.MeshStandardMaterial({ ...base, color: 0x17191c, roughness: 0.42 }); break;
    case "gold": m = new THREE.MeshStandardMaterial({ ...base, color: 0xd6ad48, metalness: 1, roughness: 0.3 }); break;
    case "steel": m = new THREE.MeshStandardMaterial({ ...base, color: 0xbcc1c6, metalness: 1, roughness: 0.3 }); break;
    case "pouch": m = new THREE.MeshStandardMaterial({ ...base, color: 0xffffff, metalness: 0.45, roughness: 0.4 }); break;
    case "pouchEdge": m = new THREE.MeshStandardMaterial({ ...base, color: 0xb5bcc3, metalness: 0.55, roughness: 0.38 }); break;
    case "flex": m = new THREE.MeshStandardMaterial({ ...base, color: 0xffffff, metalness: 0.3, roughness: 0.42, side: THREE.DoubleSide }); break;
    case "coax": m = new THREE.MeshStandardMaterial({ ...base, color: 0x2a2c2e, roughness: 0.55 }); break;
    case "pad": m = new THREE.MeshStandardMaterial({ ...base, color: 0x6c7476, roughness: 0.95 }); break;
    case "passive": m = new THREE.MeshStandardMaterial({ ...base, color: 0x8f8266, roughness: 0.5 }); break;
    case "screen": m = new THREE.MeshPhysicalMaterial({ ...base, color: 0x040506, roughness: 0.08, clearcoat: 1,
      emissive: 0xffffff, emissiveIntensity: 1.15 }); break;
    default: m = new THREE.MeshStandardMaterial({ ...base, color: 0x888888, roughness: 0.5 });
  }
  Object.assign(m, extra);
  return m;
}

/* ---------------- part registry ---------------- */

let device = null;          // THREE.Group in device frame for the current design
let parts = [];
const shellDecals = [];     // dark port openings that fade with the shell

function mulberry32(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function part(spec) {
  const group = new THREE.Group();
  device.add(group);
  const p = { mass: 0, at: [0, 0, 0], explode: [0, 0, 0], ...spec, group, meshes: [] };
  p.base = new THREE.Vector3(...p.at);
  p.explodeVec = new THREE.Vector3(...p.explode);
  group.position.copy(p.base);
  parts.push(p);
  return p;
}

function put(p, geo, mat, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.part = p;
  p.group.add(mesh);
  p.meshes.push(mesh);
  return mesh;
}

function sweepUV(pts, profile, closed = true) {
  const g = sweep(pts, profile, closed);
  const n = pts.length, m = profile.length, uv = new Float32Array(n * m * 2);
  for (let i = 0; i < m; i++) {
    for (let j = 0; j < n; j++) {
      const k = (i * n + j) * 2;
      uv[k] = j / Math.max(n - 1, 1);
      uv[k + 1] = i / Math.max(m - 1, 1);
    }
  }
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  return g;
}

/** Contiguous run of outline points that satisfy pick(), handling wrap-around. */
function wallRun(pts, pick) {
  const n = pts.length;
  let start = pts.findIndex((p, i) => pick(p) && !pick(pts[(i - 1 + n) % n]));
  if (start < 0) start = 0;
  const run = [];
  for (let k = 0; k < n; k++) {
    const p = pts[(start + k) % n];
    if (!pick(p)) break;
    run.push(p);
  }
  return run;
}

function mirrorZ(g) {
  g.scale(1, 1, -1);
  const ix = g.index.array;
  for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; }
  return g;
}

/* ---------------- enclosure ---------------- */

/** Top housing (opens down at zMate) or bottom housing (mirrored, opens up at zMate). */
function housing(spec, pts, H, R, wall, zMate, holes = [], bottom = false) {
  const p = part({ cat: "enclosure", ...spec, at: [0, 0, zMate] });
  p.shellMat = material("shell");
  housingGeometries(pts, H, R, 0.45, wall, holes).forEach((g) => put(p, bottom ? mirrorZ(g) : g, p.shellMat));
  return p;
}

function portDecal(p, facing, x, y, z, w, h) {
  const [lx, ly] = facing === "-x" ? [h, w] : [w, h];
  const m = material("chip", { color: new THREE.Color(0x0a0b0c), roughness: 0.7, side: THREE.DoubleSide });
  shellDecals.push(m);
  const mesh = put(p, capGeometry(outline(lx, ly, Math.min(lx, ly) / 2, 8), [], 0, 1), m, x, y, z - p.base.z);
  mesh.rotation.set(facing === "-y" ? Math.PI / 2 : 0, facing === "-x" ? -Math.PI / 2 : 0, 0);
  mesh.castShadow = false;
}

function bosses(p, spots, zFloor, zTop) {
  spots.forEach(([x, y]) => put(p, cylinderZ(2.1, zTop - zFloor, 20), p.shellMat, x, y, zFloor - p.base.z));
}

/* ---------------- board + silicon ---------------- */

function boardTexture(L, W, labels, seed) {
  return fitTexture(canvasTexture(1024, Math.max(64, Math.round((1024 * W) / L)), (ctx, w, h) => {
    const rnd = mulberry32(seed);
    const X = (x) => ((x + L / 2) / L) * w, Y = (y) => ((W / 2 - y) / W) * h;
    ctx.fillStyle = "#1f5a3d";
    ctx.fillRect(0, 0, w, h);
    ctx.lineCap = "round";
    for (let i = 0; i < 110; i++) {
      let x = rnd() * w, y = rnd() * h;
      ctx.strokeStyle = `rgba(118, 186, 128, ${0.18 + rnd() * 0.22})`;
      ctx.lineWidth = 1.5 + rnd() * 2;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 4; k++) { if (rnd() < 0.5) x += (rnd() - 0.5) * w * 0.3; else y += (rnd() - 0.5) * h * 0.3; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(214, 178, 88, 0.9)";
    for (let i = 0; i < 180; i++) { ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, 2.2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "rgba(238, 242, 236, 0.92)";
    ctx.font = `${Math.round((2.1 / L) * w)}px "B612 Mono", monospace`;
    labels.forEach(([t, x, y]) => ctx.fillText(t, X(x), Y(y)));
  }), L, W);
}

function board(spec, L, W, r, z, labels, seed) {
  const p = part({ cat: "compute", ...spec });
  put(p, roundedBox(L, W, 1.0, r, 0), [material("mask", { map: boardTexture(L, W, labels, seed) }), material("fr4")], 0, 0, z);
  return p;
}

function stampTexture(L, W, lines) {
  return fitTexture(canvasTexture(512, Math.max(64, Math.round((512 * W) / L)), (ctx, w, h) => {
    ctx.fillStyle = "#c7cbcf"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(60, 64, 68, 0.75)";
    ctx.textAlign = "center";
    lines.forEach((t, i) => {
      ctx.font = `${i === 0 ? 700 : 400} ${Math.round(h * (i === 0 ? 0.16 : 0.1))}px "B612 Mono", monospace`;
      ctx.fillText(t, w / 2, h * (0.42 + i * 0.17));
    });
    ctx.beginPath(); ctx.arc(w * 0.1, h * 0.14, h * 0.04, 0, Math.PI * 2); ctx.fill();
  }), L, W);
}

/** Shielded module: stamped can on the board face at z (top side) or hanging below it (under = true). */
function shieldedModule(spec, L, W, H, x, y, z, lines, under = false) {
  const p = part(spec);
  const mesh = put(p, roundedBox(L, W, H, 0.8, 0.2), [material("can", { map: stampTexture(L, W, lines), color: new THREE.Color(0xffffff) }), material("can")], x, y, under ? z - H : z);
  if (under) mesh.rotation.x = Math.PI, mesh.position.z = z;
  return p;
}

function chip(spec, L, W, H, x, y, z) {
  const p = part(spec);
  put(p, roundedBox(L, W, H, 0.3, 0.06, 3), material("chip"), x, y, z);
  return p;
}

function passives(spec, z, regions, count, seed) {
  const p = part({ cat: "compute", ...spec });
  const rnd = mulberry32(seed);
  const geo = new THREE.BoxGeometry(1.0, 0.5, 0.45);
  geo.translate(0, 0, 0.225);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), zAxis = new THREE.Vector3(0, 0, 1);
  [["passive", count], ["chip", Math.round(count * 0.4)]].forEach(([kind, total]) => {
    const inst = new THREE.InstancedMesh(geo, material(kind), total);
    for (let i = 0; i < total; i++) {
      const [x0, y0, x1, y1] = regions[i % regions.length];
      q.setFromAxisAngle(zAxis, rnd() < 0.5 ? 0 : Math.PI / 2);
      inst.setMatrixAt(i, m4.compose(new THREE.Vector3(x0 + rnd() * (x1 - x0), y0 + rnd() * (y1 - y0), z), q, one));
    }
    inst.castShadow = true;
    inst.userData.part = p;
    p.group.add(inst);
    p.meshes.push(inst);
  });
  return p;
}

/* ---------------- power ---------------- */

function batteryTexture(L, W, mah, wh) {
  return fitTexture(canvasTexture(1024, Math.round((1024 * W) / L), (ctx, w, h) => {
    ctx.fillStyle = "#c3c9ce"; ctx.fillRect(0, 0, w, h);
    const m = h * 0.1;
    ctx.fillStyle = "#1e3a5c"; ctx.fillRect(m, m, w - 2 * m, h - 2 * m);
    ctx.fillStyle = "#e9eef3"; ctx.textAlign = "left";
    ctx.font = `700 ${Math.round(h * 0.13)}px "B612 Mono", monospace`;
    ctx.fillText("Li-ion polymer", m * 2, m + h * 0.2);
    ctx.font = `400 ${Math.round(h * 0.09)}px "B612 Mono", monospace`;
    ctx.fillText(`3.85 V   ${mah} mAh   ${wh} Wh`, m * 2, m + h * 0.36);
    ctx.fillStyle = "rgba(233, 238, 243, 0.55)";
    ctx.font = `400 ${Math.round(h * 0.06)}px "B612 Mono", monospace`;
    ctx.fillText("Do not puncture, crush or heat above 60 °C", m * 2, h - m * 1.6);
  }), L, W);
}

function battery(spec, L, W, H, x, y, z, mah, wh) {
  const p = part({ cat: "compute", ...spec });
  put(p, roundedBox(L, W, H, 2.2, Math.min(0.9, H / 3), 6), [material("pouch", { map: batteryTexture(L, W, mah, wh) }), material("pouchEdge")], x, y, z);
  put(p, roundedBox(4, W * 0.5, 1.1, 0.3, 0.1), material("fr4", { color: new THREE.Color(0x1f5a3d) }), x + L / 2 + 2.2, y, z + H * 0.35);
  [-1, 1].forEach((s) => put(p, new THREE.BoxGeometry(3.2, 3, 0.15), material("steel"), x + L / 2 + 0.6, y + s * W * 0.14, z + H * 0.5));
  return p;
}

/* ---------------- radio ---------------- */

function flexTexture() {
  return canvasTexture(512, 96, (ctx, w, h) => {
    ctx.fillStyle = "#b8752a"; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#e6b25d"; ctx.lineWidth = 7; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(10, h * 0.5);
    for (let x = 10, up = true; x < w - 10; x += 22, up = !up) { ctx.lineTo(x, up ? h * 0.25 : h * 0.75); ctx.lineTo(x + 22, up ? h * 0.25 : h * 0.75); }
    ctx.stroke();
  });
}

/** Flex antenna glued to the inside of a wall, following the outline run. */
function flexAntenna(spec, run, d, z0, z1) {
  const p = part({ cat: "radio", ...spec });
  put(p, sweepUV(run, [{ d, z: z0, h: -1, v: 0 }, { d, z: z1, h: -1, v: 0 }], false), material("flex", { map: flexTexture() }));
  return p;
}

function coax(p, points, r = 0.55) {
  const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
  put(p, new THREE.TubeGeometry(curve, 64, r, 8, false), material("coax"));
  [points[0], points[points.length - 1]].forEach(([x, y, z]) => put(p, cylinderZ(1.0, 1.0, 16), material("gold"), x, y, z - 0.5));
}

/* ---------------- controls + I/O ---------------- */

/** USB-C receptacle whose opening faces -X or -Y at (x, y, z). */
function usbC(spec, facing, x, y, z) {
  const p = part({ cat: "interface", ...spec });
  const flipXY = facing === "-x";
  const dims = (a, b) => (flipXY ? [b, a] : [a, b]);
  const shape = new THREE.Shape(outline(...dims(8.94, 3.26), 1.63, 10).map((v) => new THREE.Vector2(v.x, v.y)));
  shape.holes.push(new THREE.Path(outline(...dims(8.34, 2.66), 1.33, 10).map((v) => new THREE.Vector2(v.x, v.y))));
  const holder = new THREE.Group();
  holder.position.set(x, y, z);
  holder.rotation.set(flipXY ? 0 : -Math.PI / 2, flipXY ? Math.PI / 2 : 0, 0);
  p.group.add(holder);
  const add = (geo, mat, tz) => { const m = new THREE.Mesh(geo, mat); m.position.z = tz; m.castShadow = true; m.userData.part = p; holder.add(m); p.meshes.push(m); };
  add(new THREE.ExtrudeGeometry(shape, { depth: 7.35, bevelEnabled: false, curveSegments: 10 }), material("steel"), 0);
  add(new THREE.BoxGeometry(...dims(6.6, 0.7), 5.4), material("chip"), 4.2);
  add(new THREE.BoxGeometry(...dims(8.3, 2.6), 0.6), material("chip"), 7.0);
  return p;
}

function tactSwitch(spec, x, y, z) {
  const p = part({ cat: "interface", ...spec });
  put(p, roundedBox(6, 6, 2.1, 0.5, 0.12), material("steel"), x, y, z);
  put(p, cylinderZ(1.75, 1.4, 20), material("chip"), x, y, z + 2.1);
  return p;
}

function leds(spec, spots, z) {
  const p = part({ cat: "interface", ...spec });
  spots.forEach(([x, y, lit = true]) => put(p, roundedBox(1.6, 0.8, 0.55, 0.2, 0.05, 3), lit ? material("led") : material("chip"), x, y, z));
  return p;
}

function buttonCap(spec, L, W, r, h, x, y, z) {
  const p = part({ cat: "interface", ...spec });
  put(p, roundedBox(L, W, h, r, Math.min(0.6, h / 3), 16), material("button"), x, y, z);
  return p;
}

function screenTexture(L, W) {
  return fitTexture(canvasTexture(1024, Math.round((1024 * W) / L), (ctx, w, h) => {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    const u = h / 20;
    ctx.fillStyle = "#e6fbf6";
    for (let i = 0; i < 4; i++) ctx.fillRect(u * 2 + i * u * 1.25, u * 4.6 - (1 + i * 0.55) * u, u * 0.8, (1 + i * 0.55) * u);
    ctx.font = `700 ${Math.round(u * 1.7)}px "B612 Mono", monospace`;
    ctx.textAlign = "right"; ctx.fillText("LTE", w - u * 2, u * 4.4);
    ctx.textAlign = "center";
    ctx.font = `700 ${Math.round(u * 4)}px "IBM Plex Sans", sans-serif`;
    ctx.fillText("3 guests", w / 2, h * 0.58);
    ctx.fillStyle = "#3be3cb"; ctx.fillRect(w * 0.22, h * 0.7, w * 0.34, u * 0.5);
    ctx.fillStyle = "rgba(230, 251, 246, 0.25)"; ctx.fillRect(w * 0.56, h * 0.7, w * 0.22, u * 0.5);
    ctx.fillStyle = "#e6fbf6";
    ctx.font = `400 ${Math.round(u * 1.5)}px "B612 Mono", monospace`;
    ctx.fillText("1.2 GB shared · $0.84 earned", w / 2, h * 0.86);
  }), L, W);
}

/* ---------------- shared small builders ---------------- */

const info = (des, name, cat, role, size, spec, mass, explode) => ({ id: des, des, name, cat, role, size, spec, mass, explode });

function flexPanel(spec, len, h, x, y, z, alongX = true) {
  const p = part({ cat: "radio", ...spec });
  const geo = alongX ? new THREE.BoxGeometry(len, 0.12, h) : new THREE.BoxGeometry(0.12, len, h);
  put(p, geo, material("flex", { map: flexTexture() }), x, y, z);
  return p;
}

function ringGeo(rOut, rIn, h) {
  const s = new THREE.Shape(outline(2 * rOut, 2 * rOut, rOut, 24).map((v) => new THREE.Vector2(v.x, v.y)));
  s.holes.push(new THREE.Path(outline(2 * rIn, 2 * rIn, rIn, 24).map((v) => new THREE.Vector2(v.x, v.y))));
  return new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 24 });
}

const DESIGNS = {
  card:  { label: "Card",  envelope: "98 × 62 × 13.5", size: [98, 62, 13.5], build: buildCard },
  puck:  { label: "Puck",  envelope: "Ø72 × 17", size: [72, 72, 17], build: buildPuck },
  stick: { label: "Stick", envelope: "118 × 36 × 19", size: [118, 36, 30], build: buildStick },
};

/* ============================================================
   Scene and interaction
   ============================================================ */

THREE.ColorManagement.legacyMode = false;

const canvas = document.getElementById("view");
const stageEl = document.getElementById("stage");
const infoEl = document.getElementById("info");
const hintEl = document.getElementById("hint");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.environment = (() => {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: 0x5f6664, side: THREE.BackSide }));
  room.position.y = 12;
  env.add(room);
  const panel = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.setScalar(k);
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  panel(18, 12, -14, 16, 12, 5);
  panel(26, 3, 18, 10, -14, 3);
  panel(40, 40, 0, 26.5, 0, 1.3);
  return new THREE.PMREMGenerator(renderer).fromScene(env, 0.03).texture;
})();

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa4a1, 0.3));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(-90, 170, 120);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 600 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.35;
scene.add(key);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;   // device +Z (up) -> world +Y
scene.add(root);

const camera = new THREE.PerspectiveCamera(30, 1, 1, 6000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 50;
controls.maxDistance = 1200;

const view = { explode: 0.9, opacity: 0.22, cut: 0 };   // driven by the three sliders
const DESIGN = "card";
const state = { hovered: null, selected: null };
let explodeShown = view.explode;
let opacityShown = view.opacity;
let pointerEvent = null, pointerDirty = false, downAt = null, userMovedCamera = false;
const TEAL = new THREE.Color("#3BE3CB").multiplyScalar(0.3);

/* ---------------- model ---------------- */

function buildDevice() {
  parts = [];
  device = new THREE.Group();
  root.add(device);
  DESIGNS[DESIGN].build();
  parts.forEach((p) => {
    p.mats = [...new Set(p.meshes.flatMap((m) => (Array.isArray(m.material) ? m.material : [m.material])))];
    p.isShell = p.mats.some((m) => shellMaterials.includes(m));
  });
  const f = FINISHES.graphite;
  shellMaterials.forEach((m) => m.color.set(f.shell));
  buttonMaterials.forEach((m) => m.color.set(f.button));
  ledMaterials.forEach((m) => m.emissive.set(f.led));
  parts.forEach((p) => p.mats.forEach((m) => { if (m.emissive) m.userData.baseEmissive = m.emissive.clone(); }));
  applyOpacity(true);
  applyExplode();
}

function applyOpacity(force = false) {
  const o = opacityShown, see = o < 0.999;
  [...shellMaterials, ...shellDecals].forEach((m) => {
    if (force || m.transparent !== see) { m.transparent = see; m.depthWrite = !see; m.needsUpdate = true; }
    m.opacity = o;
  });
  parts.forEach((p) => {
    if (p.isShell) p.meshes.forEach((m) => { if (shellMaterials.includes(m.material)) m.castShadow = o > 0.3; });
  });
}

const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function applyExplode() {
  const t = ease(explodeShown);
  parts.forEach((p) => p.group.position.copy(p.base).addScaledVector(p.explodeVec, t));
  const lowest = Math.min(0, ...parts.filter((p) => p.group.parent === device).map((p) => p.explodeVec.z));
  device.position.z = -lowest * t + 0.01;
}

function frameCamera() {
  const [L, W, H] = DESIGNS[DESIGN].size;
  const reach = H + 58;                       // framed for the pulled-apart view
  const radius = Math.hypot(L, W, reach) / 2;
  const vHalf = (camera.fov * Math.PI) / 360;
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const dist = (radius * 1.05) / Math.sin(Math.min(vHalf, hHalf));
  const target = new THREE.Vector3(0, reach / 2 + 2, 0);
  camera.position.copy(target).addScaledVector(new THREE.Vector3(-0.62, 0.62, 1).normalize(), dist);
  controls.target.copy(target);
  controls.update();
}

/* ---------------- hover, click, info ---------------- */

function paint(p) {
  const on = p === state.hovered || p === state.selected;
  p.mats.forEach((m) => {
    if (!m.emissive || !m.userData.baseEmissive) return;
    m.emissive.copy(m.userData.baseEmissive);
    if (on) m.emissive.add(TEAL);
  });
}

function setHover(p) {
  canvas.classList.toggle("picking", !!p);
  if (state.hovered === p) return;
  const prev = state.hovered;
  state.hovered = p;
  if (prev) paint(prev);
  if (p) paint(p);
}

const raycaster = new THREE.Raycaster();
function pick(e) {
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const targets = [];
  parts.forEach((p) => p.meshes.forEach((m) => { if (m.visible) targets.push(m); }));
  let hits = raycaster.intersectObjects(targets, false).filter((h) => cutPlane.distanceToPoint(h.point) >= 0);
  if (opacityShown < 0.05) hits = hits.filter((h) => !h.object.userData.part.isShell);
  if (!hits.length) return null;
  // While the shell is see-through, clicks go to the hardware behind it.
  const inner = opacityShown < 0.6 ? hits.find((h) => !h.object.userData.part.isShell) : null;
  return (inner || hits[0]).object.userData.part;
}

function showInfo(p, clientX = 0, clientY = 0) {
  const prev = state.selected;
  state.selected = p;
  if (prev) paint(prev);
  if (p) paint(p);
  if (!p) { infoEl.hidden = true; return; }
  const cat = CATEGORIES.find((c) => c.key === p.cat) || CATEGORIES[0];
  infoEl.style.setProperty("--dot", `var(${cat.token})`);
  document.getElementById("info-name").textContent = p.name;
  document.getElementById("info-role").textContent = p.role;
  document.getElementById("info-size").textContent = `${p.spec}\n${p.size} mm`;
  infoEl.hidden = false;
  const r = stageEl.getBoundingClientRect();
  const w = infoEl.offsetWidth, h = infoEl.offsetHeight;
  let x = clientX - r.left + 16, y = clientY - r.top + 16;
  if (x + w > r.width - 8) x = clientX - r.left - w - 16;
  if (y + h > r.height - 8) y = clientY - r.top - h - 16;
  infoEl.style.left = `${Math.max(8, Math.min(x, r.width - w - 8))}px`;
  infoEl.style.top = `${Math.max(8, Math.min(y, r.height - h - 8))}px`;
}

canvas.addEventListener("pointermove", (e) => { pointerEvent = e; pointerDirty = true; });
canvas.addEventListener("pointerleave", () => { pointerEvent = null; setHover(null); });
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; hintEl.classList.add("is-gone"); });
canvas.addEventListener("pointerup", (e) => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) showInfo(pick(e), e.clientX, e.clientY);
  downAt = null;
});
controls.addEventListener("start", () => { userMovedCamera = true; });
controls.addEventListener("change", () => { if (userMovedCamera && downAt) showInfo(null); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") showInfo(null); });

function applyCut() {
  const W = DESIGNS[DESIGN].size[1];
  const front = W / 2 + 14, back = -W / 2 - 14;   // slices from the front edge toward the back
  cutPlane.constant = view.cut <= 0 ? 1e6 : front - view.cut * (front - back);
}

function bindSlider(id, format, apply) {
  const el = document.getElementById(id), out = document.getElementById(`${id}-out`);
  const sync = () => { out.textContent = format(Number(el.value)); apply(Number(el.value) / 100); };
  el.addEventListener("input", () => { sync(); showInfo(null); hintEl.classList.add("is-gone"); });
  sync();
}
bindSlider("opacity", (v) => `${v}%`, (v) => { view.opacity = v; });
bindSlider("explode", (v) => `${v}%`, (v) => { view.explode = v; });
bindSlider("cut", (v) => (v === 0 ? "Off" : `${v}%`), (v) => { view.cut = v; applyCut(); });

/* ---------------- frame loop ---------------- */

function syncGroundToTheme() {
  const rgb = getComputedStyle(document.documentElement).getPropertyValue("--ground-bottom").trim();
  const hex = rgb.startsWith("#") ? parseInt(rgb.slice(1, 7), 16) : 0xffffff;
  const luminance = (0.299 * ((hex >> 16) & 255) + 0.587 * ((hex >> 8) & 255) + 0.114 * (hex & 255)) / 255;
  ground.material.opacity = luminance < 0.4 ? 0.45 : 0.16;
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncGroundToTheme);
new MutationObserver(syncGroundToTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function resize() {
  const w = Math.max(stageEl.clientWidth, 1), h = Math.max(stageEl.clientHeight, 1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!userMovedCamera && device) frameCamera();
}
new ResizeObserver(resize).observe(stageEl);

function approach(current, target) {
  return reduceMotion || Math.abs(target - current) < 1e-3 ? target : current + (target - current) * 0.12;
}

function tick() {
  requestAnimationFrame(tick);
  if (pointerDirty && pointerEvent && !downAt) { pointerDirty = false; setHover(pick(pointerEvent)); }
  if (explodeShown !== view.explode) { explodeShown = approach(explodeShown, view.explode); applyExplode(); }
  if (opacityShown !== view.opacity) { opacityShown = approach(opacityShown, view.opacity); applyOpacity(); }
  controls.update();
  renderer.render(scene, camera);
}

buildDevice();
resize();
frameCamera();
syncGroundToTheme();
document.getElementById("loading").hidden = true;
tick();
</script>
